name: Raise Yee audio to 50 percent
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise volume
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'audio.volume = 0.20;'
          new = 'audio.volume = 0.50;'
          if old not in s:
              raise SystemExit('Expected 20% audio volume setting not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise Yee background audio to 50 percent'
          git push
          git rm .github/workflows/raise-yee-audio-to-50.yml
          git commit -m 'Remove temporary audio volume workflow'
          git push
