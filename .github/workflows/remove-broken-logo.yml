name: Remove broken Yee header image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete logo markup and asset
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove the current CSS-generated brand block and its header anchor.
          s = re.sub(r'\.brand\{[^{}]*\}', '', s, count=1)
          s = re.sub(r'\.brand:before\{[^{}]*\}', '', s, count=1)
          s = s.replace('<a class="brand" href="#top" aria-label="Yee"></a>', '')

          # Remove any legacy image tag that used the old logo/face asset.
          s = re.sub(r'<img\b[^>]*(?:logo|face-icon)[^>]*>', '', s, flags=re.I)

          p.write_text(s, encoding="utf-8")

          asset = Path("face-icon.svg")
          if asset.exists():
              asset.unlink()

      - name: Commit and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/remove-broken-logo.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: remove broken Yee header image"
          git push