name: Raise Yee audio volume

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise background audio volume
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'audio.volume = 0.12;' not in s:
              raise SystemExit('Expected 0.12 volume setting not found; refusing to modify the file.')
          s = s.replace('audio.volume = 0.12;', 'audio.volume = 0.20;', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise Yee background audio to 20 percent'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/raise-yee-audio-volume.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/raise-yee-audio-volume.yml
          git commit -m 'Remove temporary audio volume workflow' || true
          git push || true