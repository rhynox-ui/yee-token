name: Add Yee background audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add background audio
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          audio = '''<audio id="yee-bg-audio" autoplay loop preload="auto" aria-hidden="true">
          <source src="/Yee%20(1).mp3" type="audio/mpeg">
          </audio>'''

          script = '''<script>
          (() => {
            const audio = document.getElementById('yee-bg-audio');
            if (!audio) return;

            audio.volume = 0.12;
            audio.loop = true;

            const start = () => {
              audio.play().catch(() => {});
            };

            start();

            const resume = () => {
              start();
              if (!audio.paused) {
                window.removeEventListener('pointerdown', resume, true);
                window.removeEventListener('keydown', resume, true);
                window.removeEventListener('touchstart', resume, true);
              }
            };

            window.addEventListener('pointerdown', resume, true);
            window.addEventListener('keydown', resume, true);
            window.addEventListener('touchstart', resume, true);
            document.addEventListener('visibilitychange', () => {
              if (!document.hidden && audio.paused) start();
            });
          })();
          </script>'''

          if 'id="yee-bg-audio"' not in s:
              marker = '<div class="site-bg" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>'
              s = s.replace(marker, marker + '\n' + audio)

          if "audio.volume = 0.12" not in s:
              s = s.replace('</body>', script + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-yee-background-audio.yml
          git rm .github/workflows/add-yee-background-audio.yml
          git commit -m "Add low-volume looping Yee background audio"
          git push