name: Fix Yee video playback

on:
  push:
    branches: [main]
    paths:
      - 'VID-20260903-WA0059.mp4'
      - '.github/workflows/fix-yee-video.yml'

permissions:
  contents: write

jobs:
  transcode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Inspect source video
        run: |
          ffprobe -hide_banner -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_name,codec_long_name,profile,pix_fmt,width,height,r_frame_rate,codec_type \
            -of json VID-20260903-WA0059.mp4

      - name: Re-encode for browser compatibility
        run: |
          ffmpeg -y -i VID-20260903-WA0059.mp4 \
            -map 0:v:0 -map 0:a? \
            -c:v libx264 -preset medium -crf 24 \
            -profile:v main -level 4.0 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 48000 \
            -movflags +faststart \
            VID-20260903-WA0059.browser.mp4
          mv VID-20260903-WA0059.browser.mp4 VID-20260903-WA0059.mp4
          ffprobe -hide_banner -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_name,profile,pix_fmt,width,height,codec_type \
            -of json VID-20260903-WA0059.mp4

      - name: Commit fixed video and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VID-20260903-WA0059.mp4 .github/workflows/fix-yee-video.yml
          git commit -m 'Fix Yee community video browser playback'
          git rm .github/workflows/fix-yee-video.yml
          git commit -m 'Remove temporary Yee video fix workflow'
          git push origin main
