name: Fix Yee bird asset path
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy bird asset to site root
        run: cp public/yee-bird-winging.svg yee-bird-winging.svg
      - name: Commit root asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yee-bird-winging.svg
          git commit -m "Fix Yee bird asset path" || exit 0
          git push
