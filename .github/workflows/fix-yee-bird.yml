name: Fix Yee bird animation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Yee bird to animated wing SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2=re.sub(r'background-image:url\("data:image/(?:png|gif);base64,[^\"]+"\)', 'background-image:url("/yee-bird-winging.svg")', s, count=1)
          if s2 == s:
              raise SystemExit('Bird image replacement did not match index.html')
          p.write_text(s2)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Animate Yee bird wing flapping"
          git push
