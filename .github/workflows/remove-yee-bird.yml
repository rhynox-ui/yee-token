name: Remove Yee Bird
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/remove-yee-bird.yml'
jobs:
  remove-bird:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove bird markup and script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s, n1 = re.subn(r'<style id="yee-single-bird-style">.*?</style>\s*', '', s, count=1, flags=re.S)
          s, n2 = re.subn(r'<div class="yee-bird-layer" aria-hidden="true">.*?</div>\s*', '', s, count=1, flags=re.S)
          s, n3 = re.subn(r'\(\(\) => \{\s*const bird = document\.getElementById\(\'yee-flying-bird\'\);.*?\}\)\(\);\s*', '', s, count=1, flags=re.S)
          if n1 + n2 + n3 < 3:
              raise SystemExit(f'Bird removal incomplete: style={n1}, markup={n2}, script={n3}')
          p.write_text(s)
          PY
      - name: Commit removal and delete temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove flying bird from Yee website'
          git rm .github/workflows/remove-yee-bird.yml
          git commit -m 'Remove temporary bird workflow'
          git push
