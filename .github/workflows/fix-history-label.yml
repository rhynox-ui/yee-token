name: Fix Yee history label
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-history-label.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Change history label to 01
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s2 = s.replace('001 · HISTORY', '01').replace('001 · THE BEGINNING', '01')
          if s2 == s:
              raise SystemExit('Target history label not found')
          p.write_text(s2)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Change history label to 01'
          git rm .github/workflows/fix-history-label.yml
          git commit -m 'Remove temporary history label workflow'
          git push
