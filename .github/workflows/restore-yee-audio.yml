name: Restore Yee Background Audio
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/restore-yee-audio.yml'
jobs:
  restore-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore background audio playback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          if not Path('Yee (1).mp3').exists():
              raise SystemExit('Yee (1).mp3 is missing')
          if 'id="yee-bg-audio"' not in s:
              raise SystemExit('Yee background audio element is missing')
          marker = '<!-- yee-background-audio-runtime -->'
          if marker not in s:
              block = '''\n<script>\n/* yee-background-audio-runtime */\n(() => {\n  const audio = document.getElementById('yee-bg-audio');\n  if (!audio) return;\n  audio.volume = 1.0;\n  audio.loop = true;\n  const startAudio = () => {\n    audio.volume = 1.0;\n    audio.play().catch(() => {});\n  };\n  startAudio();\n  window.addEventListener('pointerdown', startAudio, { once: true, passive: true });\n  window.addEventListener('keydown', startAudio, { once: true });\n  window.addEventListener('touchstart', startAudio, { once: true, passive: true });\n})();\n</script>\n<!-- yee-background-audio-runtime -->\n'''
              s = s.replace('</body>', block + '</body>', 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore Yee background audio playback'
          git rm .github/workflows/restore-yee-audio.yml
          git commit -m 'Remove temporary audio restore workflow'
          git push