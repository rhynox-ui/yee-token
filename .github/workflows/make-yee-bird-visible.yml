name: Make Yee bird more visible
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  make-visible:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve single bird visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            'z-index:8;pointer-events:none;overflow:hidden': 'z-index:15;pointer-events:none;overflow:hidden',
            'width:var(--bird-size);height:auto': 'width:var(--bird-size);height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))',
            '`${12 + Math.random() * 58}vh`': '`${18 + Math.random() * 52}vh`',
            '`${42 + Math.random() * 18}px`': '`${68 + Math.random() * 24}px`',
            '`${9 + Math.random() * 5}s`': '`${8 + Math.random() * 4}s`',
            '`${18000 + Math.random() * 18000}`': '`${7000 + Math.random() * 5000}`',
            'timer = setTimeout(fly, 18000 + Math.random() * 18000);': 'timer = setTimeout(fly, 7000 + Math.random() * 5000);',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make single Yee bird more visible'
          git push
          git rm .github/workflows/make-yee-bird-visible.yml
          git commit -m 'Remove temporary bird visibility workflow'
          git push
