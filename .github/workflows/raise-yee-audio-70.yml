name: Raise Yee Audio to 70%

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/raise-yee-audio-70.yml'

permissions:
  contents: write

jobs:
  update-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set background audio volume to 70 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'audio.volume = 0.50;'
          new = 'audio.volume = 0.70;'
          if old not in s:
              raise SystemExit('Expected audio.volume = 0.50; not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit audio change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise Yee background audio to 70 percent'
          git push origin main
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/raise-yee-audio-70.yml
          git add .github/workflows/raise-yee-audio-70.yml
          git commit -m 'Remove temporary audio workflow'
          git push origin main
