  <script type="module">var Yc=Object.create;var{getPrototypeOf:Jc,defineProperty:Cl,getOwnPropertyNames:qc}=Object;var Hc=Object.prototype.hasOwnProperty;var An=(e,n,t)=>{t=e!=null?Yc(Jc(e)):{};let r=n||!e||!e.__esModule?Cl(t,"default",{value:e,enumerable:!0}):t;for(let l of qc(e))if(!Hc.call(r,l))Cl(t,l,{get:()=>e[l],enumerable:!0,configurable:!0,set:(r)=>e[l]=()=>r})};

  <script>
  (function(){
    const root=document.getElementById('root');
    const app=document.createElement('div');
    app.className='min-h-screen selection:bg-white selection:text-black';
    app.innerHTML=`
      <div class="relative z-0 overflow-x-hidden">
        <header class="relative z-10 min-h-[86vh] flex flex-col justify-center items-center text-center px-6">
          <div class="inline-flex items-center rounded-full border border-white/[0.12] bg-white/[0.04] backdrop-blur-sm px-[14px] h-[26px] mb-10"><span class="text-[10px] tracking-[0.18em] uppercase text-white/50 font-[500]">EST. 2010 • DINGO PICTURES</span></div>
          <h1 class="serif text-[84px] md:text-[104px] leading-[0.9] font-[400] tracking-[-0.03em] text-white mb-5">yee.</h1>
          <p class="text-[14px] md:text-[15px] leading-[1.6] text-[#999] font-[300] tracking-[0.01em] max-w-[360px] mb-10">The dinosaur that outlived the internet.</p>
          <div class="flex items-center gap-8"><button id="originBtn" class="group text-[12px] tracking-[0.08em] text-white/80 hover:text-white flex items-center gap-[6px] transition-colors"><span class="border-b border-white/20 group-hover:border-white/60 pb-[1px]">Watch Original</span><span class="text-[13px] transition-transform group-hover:translate-x-[2px]">→</span></button><button id="archiveBtn" class="group text-[12px] tracking-[0.08em] text-white/80 hover:text-white flex items-center gap-[6px] transition-colors"><span class="border-b border-white/20 group-hover:border-white/60 pb-[1px]">Explore Archive</span><span class="text-[13px] transition-transform group-hover:translate-x-[2px]">→</span></button></div>
        </header>
        <main class="relative z-10 pb-24"><div class="mx-auto max-w-[800px] px-6 md:px-8 space-y-8">
          <section id="origin"><div class="bg-white text-[#0a0a0a] rounded-[8px] p-8 md:p-[48px]"><div class="flex items-baseline justify-between mb-10"><h2 class="text-[12px] tracking-[0.18em] uppercase font-[500] text-[#0a0a0a]/40">Origin</h2><span class="text-[10px] tracking-[0.1em] text-[#0a0a0a]/30">001</span></div><div class="space-y-6"><p class="text-[18px] md:text-[19px] leading-[1.65] tracking-[-0.01em] font-[400] text-[#111]">Yee is based on the classic internet meme from <em class="serif italic text-[20px]">Dinosaur Adventure</em>, a low-budget animated film by Dingo Pictures. An awkward dub was heard as “Yee.”</p><p class="text-[15px] leading-[1.7] text-[#666] font-[400] max-w-[560px]">It spread across YouTube, Reddit, Tumblr, becoming a defining fragment of mid-2010s absurdist media. Looped, remixed, and recontextualized endlessly — a single syllable that carried the tone of an era.</p></div></div></section>
          <section id="concept"><div class="rounded-[8px] border border-white/[0.08] bg-[#111111]/70 backdrop-blur-[12px] p-8 md:p-[48px]"><div class="flex items-baseline justify-between mb-10"><h2 class="text-[12px] tracking-[0.18em] uppercase font-[500] text-white/40">Concept</h2><span class="text-[10px] tracking-[0.1em] text-white/20">002</span></div><p class="text-[16px] md:text-[17px] leading-[1.7] font-[300] text-[#bbb] max-w-[600px]">Internet media cycles accelerate and collapse. Most artifacts vanish. <span class="text-white/90">Yee remains</span> — a recognized artifact of early digital humor. This project preserves and hosts content around the original character through community edits, artwork, and remixes. No tokenomics. No roadmap. Just archival.</p><div class="mt-10 h-[1px] w-full bg-white/[0.06]"></div><div class="mt-8 flex flex-wrap gap-x-8 gap-y-2 text-[11px] tracking-[0.12em] uppercase text-white/30"><span>Preservation</span><span class="text-white/10">/</span><span>Context</span><span class="text-white/10">/</span><span>Continuity</span></div></div></section>
          <section id="archive"><div class="pt-8"><div class="flex items-baseline justify-between mb-6 px-1"><h2 class="text-[12px] tracking-[0.18em] uppercase font-[500] text-white/40">Archive</h2><span class="text-[10px] tracking-[0.1em] text-white/20">003 — INDEX</span></div><div class="grid grid-cols-1 md:grid-cols-3 gap-[1px] bg-white/[0.08] rounded-[8px] overflow-hidden border border-white/[0.08]"><div class="group bg-[#0f0f0f] p-7 md:p-8 flex flex-col min-h-[184px] hover:bg-[#141414] transition-colors"><div class="flex justify-between items-start mb-auto"><span class="text-[10px] tracking-[0.14em] uppercase text-white/25">01</span><span class="w-[20px] h-[20px] rounded-full border border-white/[0.08] flex items-center justify-center text-[10px] text-white/20">→</span></div><div class="mt-12"><h3 class="text-[14px] tracking-[0.02em] font-[400] text-white/90 mb-1.5">Original Clip</h3><p class="text-[11px] tracking-[0.06em] text-white/35">2000 • Dingo Pictures</p></div><div class="mt-6 h-[28px] w-full rounded-[4px] bg-white/[0.03] border border-dashed border-white/[0.06] flex items-center justify-center"><span class="text-[9px] tracking-[0.12em] uppercase text-white/15">media</span></div></div><div class="group bg-[#0f0f0f] p-7 md:p-8 flex flex-col min-h-[184px] hover:bg-[#141414] transition-colors"><div class="flex justify-between items-start mb-auto"><span class="text-[10px] tracking-[0.14em] uppercase text-white/25">127+</span><span class="w-[20px] h-[20px] rounded-full border border-white/[0.08] flex items-center justify-center text-[10px] text-white/20">→</span></div><div class="mt-12"><h3 class="text-[14px] tracking-[0.02em] font-[400] text-white/90 mb-1.5">Community Edits</h3><p class="text-[11px] tracking-[0.06em] text-white/35">2010 — Present</p></div><div class="mt-6 h-[28px] w-full rounded-[4px] bg-white/[0.03] border border-dashed border-white/[0.06] flex items-center justify-center"><span class="text-[9px] tracking-[0.12em] uppercase text-white/15">media</span></div></div><div class="group bg-[#0f0f0f] p-7 md:p-8 flex flex-col min-h-[184px] hover:bg-[#141414] transition-colors"><div class="flex justify-between items-start mb-auto"><span class="text-[10px] tracking-[0.14em] uppercase text-white/25">84</span><span class="w-[20px] h-[20px] rounded-full border border-white/[0.08] flex items-center justify-center text-[10px] text-white/20">→</span></div><div class="mt-12"><h3 class="text-[14px] tracking-[0.02em] font-[400] text-white/90 mb-1.5">Artwork</h3><p class="text-[11px] tracking-[0.06em] text-white/35">Fan preservation</p></div><div class="mt-6 h-[28px] w-full rounded-[4px] bg-white/[0.03] border border-dashed border-white/[0.06] flex items-center justify-center"><span class="text-[9px] tracking-[0.12em] uppercase text-white/15">media</span></div></div></div><p class="mt-4 text-[11px] leading-[1.5] text-white/25 px-1 max-w-[520px]">Archive is curated manually. No generative filler. If you have original rips or edits from 2010–2015, contact via archive.</p></div></section>
          <div class="pt-12 pb-2"><div class="h-[1px] w-full bg-white/[0.06]"></div></div><footer class="text-center py-6"><p class="text-[11px] tracking-[0.06em] leading-[1.6] text-white/25 max-w-[520px] mx-auto">Yee Archive — Not affiliated with Dingo Pictures.<br class="hidden md:block">A cultural preservation project. Est. 2010 / Archived 2024.</p><div class="mt-8 flex items-center justify-center gap-3"><div class="h-[1px] w-[24px] bg-white/10"></div><div class="w-[3px] h-[3px] rounded-full bg-white/20"></div><div class="h-[1px] w-[24px] bg-white/10"></div></div></footer>
        </div></main>
        <div class="pointer-events-none fixed inset-0 z-[1] opacity-[0.03] mix-blend-soft-light" style="background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")"></div>
      </div>`;
    root.appendChild(app);
    const go=id=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
    document.getElementById('originBtn').onclick=()=>go('origin');
    document.getElementById('archiveBtn').onclick=()=>go('archive');
    const sections=[...document.querySelectorAll('main section')];
    const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.opacity='1';e.target.style.transform='translateY(0)'}}),{threshold:.08});
    sections.forEach(x=>{x.style.opacity='0';x.style.transform='translateY(24px)';x.style.transition='opacity .7s ease-out,transform .7s ease-out';obs.observe(x)});
  })();
  </script>
